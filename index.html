<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>周期表ドリル</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Space+Grotesk:wght@500;700&display=swap');

:root{
  --paper:#EDF1EA;
  --panel:#E3E9DF;
  --panel-2:#D9E0D4;
  --ink:#1B2420;
  --ink-soft:#54604F;
  --line:#B9C4B4;

  --accent:#2F6E5C;
  --accent-soft:#DCE9E2;
  --target:#C4832E;
  --good:#3E7D4A;
  --bad:#B0402E;
  --hint:#4C7A9E;

  --cat-alkali:#D98F82;
  --cat-alkaline:#E3B36B;
  --cat-transition:#8FAAC2;
  --cat-lanth:#B79AC9;
  --cat-act:#9AA3C9;
  --cat-post:#9FBB8C;
  --cat-metalloid:#C7B074;
  --cat-nonmetal:#77BBA8;
  --cat-halogen:#D6A25B;
  --cat-noble:#A9A296;
  --locked-a:#DBE0D6;
  --locked-b:#CBD2C4;

  --font-ui:'Space Grotesk',-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP","Segoe UI",sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,"SF Mono",Consolas,monospace;

  --cell: clamp(24px, 3.6vw, 44px);
  --radius: 5px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-ui);
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
button{font-family:inherit;}
input{font-family:inherit;}

#app{
  max-width:1040px;
  margin:0 auto;
  padding:14px 14px 40px;
}

/* ---------- Header ---------- */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  flex-wrap:wrap;
  padding-bottom:10px;
  border-bottom:2px solid var(--ink);
  margin-bottom:10px;
}
.brand{ display:flex; align-items:center; gap:9px; }
.brand svg{ display:block; }
.brand-text{ font-weight:700; font-size:1.25rem; letter-spacing:-0.01em; }
.brand-text small{
  display:block; font-weight:500; font-size:0.6rem;
  color:var(--ink-soft); letter-spacing:0.04em; margin-top:1px;
}
.topbar-right{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.range-field{ display:flex; align-items:center; gap:8px; font-size:0.85rem; color:var(--ink-soft); }
.range-field select{
  font-family:var(--font-mono); font-size:0.85rem; font-weight:700;
  color:var(--ink); background:var(--panel); border:1.5px solid var(--ink);
  border-radius:var(--radius); padding:6px 8px; cursor:pointer;
}
.profile-field{ display:flex; align-items:center; gap:6px; font-size:0.82rem; }
.nickname-display{ font-weight:700; }

/* ---------- Tabs ---------- */
.tabs{ display:flex; gap:2px; overflow-x:auto; margin-bottom:14px; -webkit-overflow-scrolling:touch; }
.tab{
  flex:0 0 auto; background:none; border:none; border-bottom:3px solid transparent;
  color:var(--ink-soft); font-size:0.86rem; font-weight:700; padding:9px 12px 7px;
  cursor:pointer; white-space:nowrap; transition:color .15s, border-color .15s, background-color .15s;
}
.tab:hover{ background:var(--panel); color:var(--ink); }
.tab.active{ color:var(--ink); border-bottom-color:var(--accent); }

/* ---------- Stage / prompt ---------- */
.stage{ background:var(--panel); border:1.5px solid var(--ink); border-radius:8px; padding:16px; }
.prompt{ min-height:64px; margin-bottom:8px; }
.prompt-eyebrow{ font-size:0.7rem; color:var(--ink-soft); font-weight:700; margin-bottom:6px; }
.prompt-text{ font-size:0.95rem; line-height:1.55; margin:0; }
.prompt-text strong{ color:var(--accent); }
.prompt-text.fact{ color:var(--ink-soft); font-size:0.86rem; margin-top:6px; }

.element-card{
  display:inline-flex; flex-direction:column; align-items:center; gap:2px;
  background:var(--paper); border:1.5px solid var(--ink); border-radius:8px;
  padding:14px 26px; margin-bottom:8px;
}
.element-card.small{ padding:8px 16px; }
.element-card-sym{ font-family:var(--font-mono); font-weight:700; font-size:2.4rem; line-height:1; }
.element-card.small .element-card-sym{ font-size:1.5rem; }
.element-card-name{ font-size:0.95rem; color:var(--ink-soft); font-weight:500; }

.feedback{
  min-height:1.4em; font-size:0.88rem; font-weight:700; margin:4px 0 10px;
  opacity:0; transition:opacity .12s;
}
.feedback.show{ opacity:1; }
.feedback.good{ color:var(--good); }
.feedback.bad{ color:var(--bad); }
.feedback.neutral{ color:var(--target); }

/* ---------- Legend (home only) ---------- */
.legend{
  display:none; flex-wrap:wrap; gap:8px 14px; padding:10px 0 4px; margin-bottom:6px;
  border-top:1px dashed var(--line); border-bottom:1px dashed var(--line);
}
body[data-mode="home"] .legend{ display:flex; }
.legend-item{ display:flex; align-items:center; gap:5px; font-size:0.72rem; color:var(--ink-soft); }
.legend-swatch{ width:11px; height:11px; border-radius:3px; border:1px solid rgba(0,0,0,0.25); flex:0 0 auto; }

/* ---------- Table ---------- */
.table-wrap{ overflow-x:auto; padding:6px 2px 10px; -webkit-overflow-scrolling:touch; }
.ptable{
  display:grid;
  grid-template-columns: repeat(18, var(--cell));
  grid-template-rows: repeat(7, var(--cell)) calc(var(--cell) * 0.32) repeat(2, var(--cell));
  gap:3px; width:max-content; margin:0 auto;
}
.cell{
  position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
  border-radius:4px; cursor:pointer; user-select:none; color:var(--ink);
  transition:transform .1s, box-shadow .15s;
}
.cell:hover{ transform:scale(1.06); z-index:3; }
.cell .label{ visibility:hidden; }
.cell.show-label .label{ visibility:visible; }
.cell .num{
  position:absolute; top:2px; left:3px; font-family:var(--font-mono);
  font-size:calc(var(--cell) * 0.24); opacity:0.6;
}
.cell .sym{ font-family:var(--font-mono); font-weight:700; font-size:calc(var(--cell) * 0.36); }

.cat-alkali{ background:var(--cat-alkali); }
.cat-alkaline{ background:var(--cat-alkaline); }
.cat-transition{ background:var(--cat-transition); }
.cat-lanth{ background:var(--cat-lanth); }
.cat-act{ background:var(--cat-act); }
.cat-post{ background:var(--cat-post); }
.cat-metalloid{ background:var(--cat-metalloid); }
.cat-nonmetal{ background:var(--cat-nonmetal); }
.cat-halogen{ background:var(--cat-halogen); }
.cat-noble{ background:var(--cat-noble); }

.cell.placeholder{
  font-family:var(--font-mono); font-size:calc(var(--cell) * 0.22);
  text-align:center; line-height:1.15; cursor:default;
}
.cell.placeholder:hover{ transform:none; }
.cell.placeholder .ph-text{ padding:0 2px; opacity:0.85; }

.cell.locked{
  background-image:repeating-linear-gradient(45deg, var(--locked-a), var(--locked-a) 5px, var(--locked-b) 5px, var(--locked-b) 10px);
  pointer-events:none; cursor:default;
}
.cell.locked:hover{ transform:none; }
.cell.locked .label{ visibility:hidden !important; }
.cell.locked.placeholder .ph-text{ visibility:hidden; }

.cell.target{ outline:3px solid var(--target); outline-offset:1px; z-index:2; animation:pulse 1.1s infinite; }
.cell.candidate{ outline:2px solid var(--hint); outline-offset:1px; z-index:2; }
.cell.spotlight{ outline:2px solid var(--hint); outline-offset:1px; z-index:2; }
.cell.correct{ background:var(--good) !important; color:#fff; }
.cell.correct .num{ opacity:0.85; }
.cell.wrong{ background:var(--bad) !important; color:#fff; animation:shake .3s; }
.cell.reveal{ outline:2px dashed var(--target); outline-offset:1px; z-index:2; }
.cell.filled{ cursor:default; }

@keyframes pulse{
  0%,100%{ box-shadow:0 0 0 0 rgba(196,131,46,.55); }
  50%{ box-shadow:0 0 0 7px rgba(196,131,46,0); }
}
@keyframes shake{
  0%,100%{ transform:translateX(0); }
  25%{ transform:translateX(-3px); }
  75%{ transform:translateX(3px); }
}
@media (prefers-reduced-motion: reduce){
  .cell.target{ animation:none; }
  .cell.wrong{ animation:none; }
}

.scroll-hint{ display:none; text-align:center; font-size:0.72rem; color:var(--ink-soft); margin-top:-4px; }
@media (max-width:640px){ .scroll-hint{ display:block; } }

/* ---------- Controls / inputs ---------- */
.controls{ margin-top:12px; display:flex; flex-wrap:wrap; align-items:center; gap:10px; }
.field-row{ display:flex; gap:8px; flex-wrap:wrap; }
.text-input{
  font-family:var(--font-mono); font-size:1.05rem; font-weight:700; padding:9px 12px;
  border:1.5px solid var(--ink); border-radius:var(--radius); background:var(--paper);
  color:var(--ink); width:150px;
}
.text-input.wide{ width:240px; font-family:var(--font-ui); font-size:1rem; }
.text-input:focus{ outline:2px solid var(--accent); outline-offset:1px; }
.text-input:disabled{ opacity:0.5; }

.btn{
  font-size:0.85rem; font-weight:700; padding:9px 16px; border-radius:var(--radius);
  border:1.5px solid var(--ink); background:var(--paper); color:var(--ink);
  cursor:pointer; transition:background-color .12s, transform .08s;
}
.btn:hover{ background:var(--accent-soft); }
.btn:active{ transform:translateY(1px); }
.btn-primary{ background:var(--accent); border-color:var(--accent); color:#fff; }
.btn-primary:hover{ background:#265c4d; }
.btn-ghost{ background:transparent; }
.btn-text{
  background:none; border:none; color:var(--ink-soft); font-size:0.75rem; font-weight:700;
  text-decoration:underline; cursor:pointer; padding:4px 0;
}

/* ---------- Status bar ---------- */
.statusbar{
  display:flex; flex-wrap:wrap; align-items:center; gap:14px; margin-top:16px;
  padding-top:10px; border-top:1px dashed var(--line); font-size:0.82rem;
  color:var(--ink-soft); min-height:20px;
}
.stat strong{ color:var(--ink); font-family:var(--font-mono); }

footer.note{ text-align:center; font-size:0.72rem; color:var(--ink-soft); margin-top:18px; }

/* ---------- Ranking ---------- */
.ranking-panel{ margin-top:14px; border:1.5px solid var(--ink); border-radius:8px; padding:12px; background:var(--paper); }
.ranking-panel[hidden]{ display:none; }
.ranking-tabs{ display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
.rtab{
  font-size:0.78rem; font-weight:700; padding:5px 10px; border:1.5px solid var(--ink);
  border-radius:var(--radius); background:var(--panel); cursor:pointer;
}
.rtab.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
.ranking-note{ font-size:0.72rem; color:var(--ink-soft); margin:0 0 8px; line-height:1.5; }
.ranking-table{ width:100%; border-collapse:collapse; font-size:0.85rem; }
.ranking-table th, .ranking-table td{ text-align:left; padding:5px 6px; border-bottom:1px solid var(--line); }
.ranking-table td:first-child, .ranking-table th:first-child{ width:28px; font-family:var(--font-mono); color:var(--ink-soft); }
.ranking-table tr.me{ background:var(--accent-soft); font-weight:700; }
.ranking-close{ margin-top:10px; }

/* ---------- Overlay (nickname) ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(27,36,32,0.6);
  display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;
}
.overlay[hidden]{ display:none; }
.overlay-card{
  background:var(--paper); border:2px solid var(--ink); border-radius:10px;
  padding:24px; max-width:360px; width:100%;
}
.overlay-card h2{ margin:0 0 8px; font-size:1.1rem; }
.overlay-card p{ font-size:0.85rem; color:var(--ink-soft); line-height:1.55; margin:0 0 14px; }
.overlay-card .text-input{ width:100%; margin-bottom:10px; }
.overlay-card .btn{ width:100%; }
</style>
</head>

</div>

<div class="overlay" id="nicknameOverlay" hidden>

    <input type="text" id="nicknameInput" class="text-input wide" maxlength="12" placeholder="例: げんそ太郎" autocomplete="off">
    <button id="nicknameSubmitBtn" class="btn btn-primary" type="button">はじめる</button>
  </div>
</div>

const FIRESTORE_COLLECTIONS = { exam:'examScores', timeattack:'timeattackScores' };

/* =========================================================
   2. 永続化ストレージ（ニックネーム・自己ベスト）
   ========================================================= */

function loadStore(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && typeof parsed==='object'){
        return {
          nickname: parsed.nickname || null,
          records: parsed.records || {},
          rankingLog: Array.isArray(parsed.rankingLog) ? parsed.rankingLog : []
        };
      }
    }
  }catch(err){ /* ストレージが使えない環境ではメモリ上のみで動作 */ }
  return { nickname:null, records:{}, rankingLog:[] };
}
let store = loadStore();
function saveStore(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }catch(err){ /* 保存できなくても続行 */ }
}
function recordKey(mode, range){ return mode+':'+range; }
function getBestStreak(mode, range){
  const rec = store.records[recordKey(mode,range)];
  return (rec && rec.bestStreak) ? rec.bestStreak : 0;
}
function maybeUpdateBestStreak(mode, range, streak){
  const key = recordKey(mode,range);
  if(!store.records[key]) store.records[key] = {};
  if(!store.records[key].bestStreak || streak>store.records[key].bestStreak){
    store.records[key].bestStreak = streak;
    saveStore();
    return true;
  }
  return false;
}
function getBestTimeAttack(range){
  return store.records[recordKey('timeattack',range)] || null;
}
function maybeUpdateBestTimeAttack(range, timeMs, mistakes){
  const key = recordKey('timeattack', range);
  const rec = store.records[key];
  if(!rec || timeMs < rec.bestTimeMs){
    store.records[key] = { bestTimeMs:timeMs, bestMistakes:mistakes };
    saveStore();
    return true;
  }
  return false;
}

/* =========================================================
   2b. ランキング
   バックエンド未設定の間は、この端末内の記録だけを対象にした
   「ローカル版ランキング」として動作します（他の人の記録は見えません）。
   ========================================================= */

function escapeHtml(str){
  return (str==null?'':String(str)).replace(/[&<>"']/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

function saveLocalRankingEntry(entry){
  if(!Array.isArray(store.rankingLog)) store.rankingLog = [];
  store.rankingLog.push(entry);
  if(store.rankingLog.length>500) store.rankingLog = store.rankingLog.slice(-500);
  saveStore();
}

function filterByPeriod(entries, period){
  if(period==='all') return entries;
  const now = new Date();
  const todayStr = now.toDateString();
  const monthKey = now.getFullYear()+'-'+now.getMonth();
  return entries.filter(e=>{
    const d = new Date(e.ts);
    if(period==='today') return d.toDateString()===todayStr;
    if(period==='month') return (d.getFullYear()+'-'+d.getMonth())===monthKey;
    return true;
  });
}

function getLocalRanking(mode, range, period){
  const log = (store.rankingLog||[]).filter(e=> e.mode===mode && e.range===range);
  const filtered = filterByPeriod(log, period);
  const sorted = filtered.slice().sort((a,b)=>{
    return mode==='timeattack' ? (a.timeMs - b.timeMs) : (b.score - a.score);
  });
  return sorted.slice(0,20);
}

async function submitScore(mode, range, payload){
  const entry = Object.assign({ nickname: store.nickname||'名無し', mode, range, ts: Date.now() }, payload);
  saveLocalRankingEntry(entry); // オフライン時の保険として端末内にも残す
  if(window.db){
    try{
      const { mode:_omit, ...data } = entry; // Firestore側はコレクション名でモードを表すので除く
      await window.db.collection(FIRESTORE_COLLECTIONS[mode]).add(data);
    }catch(err){ console.warn('スコアの送信に失敗しました（ローカルには記録済みです）', err); }
  }
}

async function fetchRanking(mode, range, period){
  if(window.db){
    try{
      const sortField = mode==='exam' ? 'score' : 'timeMs';
      const sortDir = mode==='exam' ? 'desc' : 'asc';
      const snap = await window.db.collection(FIRESTORE_COLLECTIONS[mode])
        .where('range','==', range)
        .orderBy(sortField, sortDir)
        .limit(200)
        .get();
      const all = snap.docs.map(d=>d.data());
      return filterByPeriod(all, period).slice(0,20);
    }catch(err){
      console.warn('ランキングの取得に失敗しました。ローカル記録を表示します。', err);
    }
  }
  return getLocalRanking(mode, range, period);
}

function renderRankingRows(mode, entries){
  if(!entries.length) return '<tr><td colspan="4">まだ記録がありません</td></tr>';
  return entries.map((e,i)=>{
    const scoreText = mode==='timeattack'
      ? `${formatTime(e.timeMs)}（ミス${e.mistakes}）`
      : `${e.score}/${e.total}`;
    const dateText = new Date(e.ts).toLocaleDateString('ja-JP');
    const isMe = e.nickname === store.nickname;
    return `<tr class="${isMe?'me':''}"><td>${i+1}</td><td>${escapeHtml(e.nickname)}</td><td>${scoreText}</td><td>${dateText}</td></tr>`;
  }).join('');
}

    </table>
    <button class="btn-text ranking-close" type="button" id="rankingCloseBtn">閉じる</button>
  `;
  panel.querySelectorAll('.rtab').forEach(btn=>{
    btn.addEventListener('click', ()=> showRanking(mode, btn.dataset.period));
  });
  document.getElementById('rankingCloseBtn').addEventListener('click', ()=>{ panel.hidden = true; });

  const entries = await fetchRanking(mode, state.range, period);
  const tbody = document.getElementById('rankingTbody');
  if(tbody) tbody.innerHTML = renderRankingRows(mode, entries);
}

/* =========================================================
   3. 状態
   ========================================================= */

const state = {
  mode:'home',
  range:DEFAULT_RANGE,
  activeElements:[],
  current:null,
  busy:false,
  pendingTimeout:null,
  stats:{
    position:{correct:0,total:0,streak:0,best:0},
    type:{correct:0,total:0,streak:0,best:0},
    match:{correct:0,total:0,streak:0,best:0},
    group:{correct:0,total:0,streak:0,best:0},
    exam:{correct:0,total:0,streak:0,best:0}
  },
  timeAttack:{ running:false, startTs:0, mistakes:0, filled:new Set(), selected:null, timerId:null, lastResult:null }
};

const cellByNum = new Map();
let placeholders = [];

/* =========================================================
   4. DOM 参照
   ========================================================= */

const tableEl = document.getElementById('ptable');
const promptPanel = document.getElementById('promptPanel');
const feedbackEl = document.getElementById('feedback');

const statusBar = document.getElementById('statusBar');
const legendEl = document.getElementById('legend');
const rangeSelect = document.getElementById('rangeSelect');
const tabsNav = document.getElementById('modeTabs');

/* =========================================================
   5. ユーティリティ
   ========================================================= */

function normalizeSymbol(raw){
  let s = (raw||'').trim().replace(/[\u3000\s]+/g,'');
  if(!s) return '';
  return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
}
function toKatakana(str){
  return (str||'').replace(/[\u3041-\u3096]/g, ch=>String.fromCharCode(ch.charCodeAt(0)+0x60));
}
function normalizeJP(str){
  return toKatakana((str||'').trim().replace(/[\u3000\s]+/g,''));
}
function acceptableNameAnswers(e){
  const set = new Set();
  set.add(normalizeJP(e.name));
  const readings = ELEMENT_READINGS[e.n];
  if(readings) readings.forEach(r=> set.add(normalizeJP(r)));
  return set;
}

function describePosition(e){
  if(e.row<=7) return `第${e.row}周期・${e.col}族`;
  if(e.row===9) return 'ランタノイド';
  return 'アクチノイド';
}

function pickRandomElement(excludeN){
  const pool = state.activeElements.filter(e=>e.n!==excludeN);
  const src = pool.length ? pool : state.activeElements;
  return src[Math.floor(Math.random()*src.length)];
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function formatTime(ms){
  const totalSec = Math.max(0,ms)/1000;
  const m = Math.floor(totalSec/60);
  const s = (totalSec%60).toFixed(1).padStart(4,'0');
  return `${m}:${s}`;
}
function clearFeedback(){
  feedbackEl.textContent='';
  feedbackEl.className='feedback';
}
function setFeedback(text, kind){
  feedbackEl.textContent = text;
  feedbackEl.className = 'feedback show ' + (kind||'neutral');
}
function scheduleNext(fn, ms){
  clearTimeout(state.pendingTimeout);
  state.pendingTimeout = setTimeout(()=>{ state.busy=false; fn(); }, ms);
}
function resetCellVisuals(){
  cellByNum.forEach(div=>{
    if(!div.classList.contains('locked')){
      div.classList.remove('show-label','correct','wrong','target','reveal','filled','candidate','spotlight');
    }
  });
}
function setDefaultLabels(showAll){
  cellByNum.forEach(div=>{
    if(!div.classList.contains('locked')) div.classList.toggle('show-label', showAll);
  });
}

async function copyToClipboard(text){
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(err){ /* フォールバックへ */ }
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(err){
    return false;
  }
}

/* =========================================================
   6. テーブル構築・範囲適用
   ========================================================= */

function buildTable(){
  tableEl.innerHTML='';
  cellByNum.clear();
  placeholders = [];

  ELEMENTS.forEach(e=>{
    const div = document.createElement('div');
    div.className = `cell cat-${e.cat}`;
    div.style.gridRow = e.row;
    div.style.gridColumn = e.col;
    div.dataset.n = e.n;
    div.innerHTML = `<span class="num label">${e.n}</span><span class="sym label">${e.sym}</span>`;
    div.addEventListener('click', ()=>onCellClick(e));
    tableEl.appendChild(div);
    cellByNum.set(e.n, div);
  });

  const ph1 = document.createElement('div');
  ph1.className = 'cell placeholder cat-lanth';
  ph1.style.gridRow = 6; ph1.style.gridColumn = 3;
  ph1.dataset.threshold = 57;
  ph1.innerHTML = '<span class="ph-text">57–71</span>';
  ph1.addEventListener('click', ()=>{
    if(state.mode==='home' && !ph1.classList.contains('locked')) showPlaceholderInfo('ランタノイド', 57, 71);
  });
  tableEl.appendChild(ph1); placeholders.push(ph1);

  const ph2 = document.createElement('div');
  ph2.className = 'cell placeholder cat-act';
  ph2.style.gridRow = 7; ph2.style.gridColumn = 3;
  ph2.dataset.threshold = 89;
  ph2.innerHTML = '<span class="ph-text">89–103</span>';
  ph2.addEventListener('click', ()=>{
    if(state.mode==='home' && !ph2.classList.contains('locked')) showPlaceholderInfo('アクチノイド', 89, 103);
  });
  tableEl.appendChild(ph2); placeholders.push(ph2);
}

function applyRange(range){
  state.range = range;
  state.activeElements = ELEMENTS.filter(e=>e.n<=range);
  cellByNum.forEach((div,n)=>{ div.classList.toggle('locked', n>range); });
  placeholders.forEach(ph=>{ ph.classList.toggle('locked', range < +ph.dataset.threshold); });
}

function resetAllSessionStats(range){
  ['position','type','match','group','exam'].forEach(m=>{
    state.stats[m] = { correct:0, total:0, streak:0, best:getBestStreak(m, range) };
  });
}

function buildLegend(){
  const order = ['alkali','alkaline','transition','lanth','act','post','metalloid','nonmetal','halogen','noble'];
  legendEl.innerHTML = order.map(cat=>`
    <span class="legend-item">
      <span class="legend-swatch" style="background:var(--cat-${cat})"></span>
      ${CATEGORY_LABEL_JP[cat]}
    </span>
  `).join('');
}

/* =========================================================
   7. タブ / モード切替 / 出題ディスパッチ
   ========================================================= */

function buildTabs(){
  tabsNav.innerHTML='';
  MODES.forEach(m=>{
    const b = document.createElement('button');
    b.className = 'tab'; b.type = 'button'; b.dataset.mode = m;
    b.textContent = MODE_LABELS[m];
    b.addEventListener('click', ()=>switchMode(m));
    tabsNav.appendChild(b);
  });
}
function setActiveTab(mode){
  tabsNav.querySelectorAll('.tab').forEach(t=> t.classList.toggle('active', t.dataset.mode===mode));
}

function switchMode(mode){
  if(state.mode==='timeattack') stopTimer();
  state.mode = mode;
  document.body.dataset.mode = mode;
  setActiveTab(mode);
  clearFeedback();
  resetCellVisuals();
  const rankingPanel = document.getElementById('rankingPanel');
  if(rankingPanel) rankingPanel.hidden = true;

  if(mode==='home') startHome();
  else if(mode==='timeattack') startTimeAttack();
  else if(mode==='exam') startExam();
  else beginQuestionKind(mode);
}

function beginQuestionKind(kind){
  if(kind==='position') beginPositionQuestion();
  else if(kind==='type') beginTypeQuestion();
  else if(kind==='match') beginMatchQuestion();
  else if(kind==='group') beginGroupQuestion();
  else if(kind==='trend') beginTrendQuestion();
  else if(kind==='trivia') beginTriviaQuestion();
}

function startExam(){
  state.stats.exam = { correct:0, total:0, streak:0, best:getBestStreak('exam', state.range) };
  advanceQuestion();
}

function advanceQuestion(){
  resetCellVisuals();
  clearFeedback();
  if(state.mode==='exam'){
    if(state.stats.exam.total >= EXAM_TOTAL_QUESTIONS){ finishExamSession(); return; }
    const kind = QUESTION_KINDS[Math.floor(Math.random()*QUESTION_KINDS.length)];
    beginQuestionKind(kind);
  } else {
    beginQuestionKind(state.mode);
  }
}

function finishExamSession(){
  const s = state.stats.exam;
  submitScore('exam', state.range, { score:s.correct, total:EXAM_TOTAL_QUESTIONS });
  const acc = Math.round(s.correct/EXAM_TOTAL_QUESTIONS*100);
  promptPanel.innerHTML = `
    <div class="prompt-eyebrow">本番 終了！</div>
    <p class="prompt-text">${EXAM_TOTAL_QUESTIONS}問中 <strong>${s.correct}</strong> 問正解でした（正答率 ${acc}%）</p>
  `;
  controls.innerHTML = `
    <button class="btn btn-primary" id="examAgainBtn" type="button">もう一度</button>
    <button class="btn-text" id="examRankBtn" type="button">ランキングを見る</button>
  `;
  document.getElementById('examAgainBtn').addEventListener('click', startExam);
  document.getElementById('examRankBtn').addEventListener('click', ()=> showRanking('exam','all'));
  clearFeedback();
  updateStatusBar();
}

/* =========================================================
   8. ホームモード
   ========================================================= */

function startHome(){
  clearTimeout(state.pendingTimeout); state.busy=false;
  setDefaultLabels(true);
  promptPanel.innerHTML = `
    <div class="prompt-eyebrow">ホーム・参照表</div>
    <p class="prompt-text">上のタブからモードを選んで練習を始めましょう。マスをタップすると原子番号・元素名・分類・簡単な特徴が見られます。「本番」と「タイムアタック」が本番モード、それ以外は練習用です。</p>
  `;
  controls.innerHTML='';
  statusBar.innerHTML='';
}

function showInfo(e){
  const fact = ELEMENT_FACTS[e.n] || '';
  promptPanel.innerHTML = `
    <div class="prompt-eyebrow">${describePosition(e)}</div>
    <div class="element-card small">
      <span class="element-card-sym">${e.sym}</span>
      <span class="element-card-name">${e.name}</span>
    </div>
    <p class="prompt-text">原子番号 ${e.n}　${CATEGORY_LABEL_JP[e.cat]}</p>
    ${fact ? `<p class="prompt-text fact">${fact}</p>` : ''}
  `;
}
function showPlaceholderInfo(label, from, to){
  promptPanel.innerHTML = `
    <div class="prompt-eyebrow">${label}</div>
    <p class="prompt-text">原子番号 ${from}〜${to} の${label}は、表の下に別枠で並んでいます。</p>
  `;
}

/* =========================================================
   9. 共通UI部品：テキスト回答フォーム
   ========================================================= */

function renderTextAnswerUI(promptHtml, onSubmit, opts){
  opts = opts || {};
  promptPanel.innerHTML = promptHtml;
  const placeholder = opts.placeholder || '';
  const maxlength = opts.maxlength || 20;
  const wideClass = opts.wide ? ' wide' : '';
  controls.innerHTML = `
    <div class="field-row">
      <input type="text" id="answerInput" class="text-input${wideClass}" placeholder="${placeholder}" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="${maxlength}">
      <button class="btn btn-primary" id="answerSubmitBtn" type="button">回答</button>
    </div>
  `;
  const input = document.getElementById('answerInput');

  input.focus();
}

/* =========================================================
   10. 問題種別 1：元素 → 位置（タップ）
   ========================================================= */

function beginPositionQuestion(){
  const prevN = state.current && state.current.target ? state.current.target.n : null;
  const target = pickRandomElement(prevN);
  state.current = { kind:'position', target };
  setDefaultLabels(false);

  promptPanel.innerHTML = `
    <div class="prompt-eyebrow">元素 → 位置</div>
    <div class="element-card">
      <span class="element-card-sym">${target.sym}</span>
      <span class="element-card-name">${target.name}</span>
    </div>
    <p class="prompt-text">この元素の位置を、下の周期表からタップしてください。</p>
  `;
  controls.innerHTML = `<button class="btn btn-ghost" id="skipBtn" type="button">スキップ（答えを見る）</button>`;
  document.getElementById('skipBtn').addEventListener('click', skipPosition);
  updateStatusBar();
}
function handlePositionAnswer(clicked){
  if(state.busy) return;
  state.busy = true;
  const target = state.current.target;
  const stats = state.stats[state.mode];
  stats.total++;
  if(clicked.n === target.n){
    const div = cellByNum.get(clicked.n);
    div.classList.add('show-label','correct');
    stats.correct++; stats.streak++; if(stats.streak>stats.best) stats.best=stats.streak;
    maybeUpdateBestStreak(state.mode, state.range, stats.streak);
    setFeedback('正解！', 'good');
    scheduleNext(()=>advanceQuestion(), 800);
  } else {
    const wrongDiv = cellByNum.get(clicked.n);
    const correctDiv = cellByNum.get(target.n);
    wrongDiv.classList.add('show-label','wrong');
    correctDiv.classList.add('show-label','reveal');
    stats.streak = 0;
    setFeedback(`不正解。正しい位置は点線の枠です（${describePosition(target)}）`, 'bad');
    scheduleNext(()=>advanceQuestion(), 1700);
  }
  updateStatusBar();
}
function skipPosition(){
  if(state.busy) return;
  state.busy = true;
  const target = state.current.target;
  cellByNum.get(target.n).classList.add('show-label','reveal');
  setFeedback(`位置は ${describePosition(target)} です`, 'neutral');
  scheduleNext(()=>advanceQuestion(), 1500);
}

/* =========================================================
   11. 問題種別 2：位置 → 元素記号入力
   ========================================================= */

function beginTypeQuestion(){
  const prevN = state.current && state.current.target ? state.current.target.n : null;
  const target = pickRandomElement(prevN);
  state.current = { kind:'type', target };
  setDefaultLabels(true);
  const targetDiv = cellByNum.get(target.n);
  targetDiv.classList.remove('show-label');
  targetDiv.classList.add('target');

  renderTextAnswerUI(`
    <div class="prompt-eyebrow">位置 → 記号</div>
    <p class="prompt-text">オレンジ色の枠でハイライトされたマスの<strong>元素記号</strong>を入力してください。</p>
  `, handleTypeAnswer, {placeholder:'例: Na', maxlength:3});
  updateStatusBar();
}
function handleTypeAnswer(raw){
  if(state.busy) return;
  const val = normalizeSymbol(raw);
  if(!val) return;
  state.busy = true;
  const target = state.current.target;
  const div = cellByNum.get(target.n);
  const stats = state.stats[state.mode];
  stats.total++;
  if(val === target.sym){
    div.classList.add('show-label','correct'); div.classList.remove('target');
    stats.correct++; stats.streak++; if(stats.streak>stats.best) stats.best=stats.streak;
    maybeUpdateBestStreak(state.mode, state.range, stats.streak);
    setFeedback('正解！', 'good');
    scheduleNext(()=>advanceQuestion(), 800);
  } else {
    div.classList.add('show-label','wrong');
    stats.streak = 0;
    setFeedback(`不正解。正解は ${target.sym}（${target.name}）`, 'bad');
    scheduleNext(()=>advanceQuestion(), 1800);
  }
  updateStatusBar();
}

/* =========================================================
   12. 問題種別 3：元素記号 ⇔ 元素名（どちらも入力式）
   ========================================================= */

function beginMatchQuestion(){
  const prevN = state.current && state.current.target ? state.current.target.n : null;
  const target = pickRandomElement(prevN);
  const direction = Math.random()<0.5 ? 'sym2name' : 'name2sym';
  state.current = { kind:'match', target, direction };

  if(direction==='sym2name'){
    setDefaultLabels(true);
    cellByNum.get(target.n).classList.add('spotlight');
    renderTextAnswerUI(`
      <div class="prompt-eyebrow">記号 → 名前</div>
      <div class="element-card"><span class="element-card-sym">${target.sym}</span></div>
      <p class="prompt-text">この元素の名前を入力してください（ひらがな・カタカナ・漢字のどれでもOK）。</p>
    `, handleMatchNameAnswer, {placeholder:'例: すいそ / 水素', maxlength:16, wide:true});
  } else {
    setDefaultLabels(false);
    renderTextAnswerUI(`
      <div class="prompt-eyebrow">名前 → 記号</div>
      <p class="prompt-text">「<strong>${target.name}</strong>」の元素記号を入力してください。</p>
    `, handleMatchSymbolAnswer, {placeholder:'例: Na', maxlength:3});
  }
  updateStatusBar();
}
function handleMatchNameAnswer(raw){
  if(state.busy) return;
  const val = normalizeJP(raw);
  if(!val) return;
  state.busy = true;
  const target = state.current.target;
  const stats = state.stats[state.mode];
  const correct = acceptableNameAnswers(target).has(val);
  stats.total++;
  if(correct){ stats.correct++; stats.streak++; if(stats.streak>stats.best) stats.best=stats.streak; maybeUpdateBestStreak(state.mode, state.range, stats.streak); }
  else stats.streak = 0;
  setFeedback(correct ? '正解！' : `不正解。正解は「${target.name}」`, correct?'good':'bad');
  scheduleNext(()=>advanceQuestion(), correct?800:1900);
  updateStatusBar();
}
function handleMatchSymbolAnswer(raw){
  if(state.busy) return;
  const val = normalizeSymbol(raw);
  if(!val) return;
  state.busy = true;
  const target = state.current.target;
  const stats = state.stats[state.mode];
  const correct = val === target.sym;
  stats.total++;
  if(correct){ stats.correct++; stats.streak++; if(stats.streak>stats.best) stats.best=stats.streak; maybeUpdateBestStreak(state.mode, state.range, stats.streak); }
  else stats.streak = 0;
  setFeedback(correct ? '正解！' : `不正解。正解は ${target.sym}`, correct?'good':'bad');
  scheduleNext(()=>advanceQuestion(), correct?800:1700);
  updateStatusBar();
}

/* =========================================================
   13. 問題種別 4：仲間さがし（白紙のマスに記号を書く・自動送り）
   ========================================================= */

function beginGroupQuestion(){
  let category=null, members=[];
  for(let attempt=0; attempt<8; attempt++){
    const prevCat = state.current && state.current.category ? state.current.category : null;
    const pool = GROUP_MODE_CATEGORIES.filter(c=>c!==prevCat);
    const candidatePool = pool.length ? pool : GROUP_MODE_CATEGORIES;
    category = candidatePool[Math.floor(Math.random()*candidatePool.length)];
    members = state.activeElements.filter(e=>e.cat===category).sort((a,b)=>a.n-b.n);
    if(members.length>0) break;
  }
  if(!members.length){ beginPositionQuestion(); return; }

  setDefaultLabels(false);
  members.forEach(m=> cellByNum.get(m.n).classList.add('candidate'));
  state.current = { kind:'group', category, members, filled:new Set(), selected:null, mistakes:0 };

  promptPanel.innerHTML = `
    <div class="prompt-eyebrow">仲間さがし</div>
    <p class="prompt-text">青い枠は<strong>${CATEGORY_LABEL_JP[category]}</strong>の元素です。オレンジの枠のマスから順に、元素記号を入力してください。（残り <span id="groupRemaining">${members.length}</span> 個）</p>
  `;
  controls.innerHTML = `
    <div class="field-row">
      <input type="text" id="groupInput" class="text-input" placeholder="元素記号" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="3">
      <button class="btn btn-primary" id="groupSubmitBtn" type="button">入力</button>
    </div>
    <button class="btn btn-ghost" id="groupGiveUpBtn" type="button">あきらめて答えを見る</button>
  `;
  document.getElementById('groupSubmitBtn').addEventListener('click', submitGroupAnswer);
  document.getElementById('groupInput').addEventListener('keydown', ev=>{ if(ev.key==='Enter') submitGroupAnswer(); });
  document.getElementById('groupGiveUpBtn').addEventListener('click', giveUpGroup);

  selectGroupCell(members[0]);
  updateStatusBar();
}
function selectGroupCell(e){
  const cur = state.current;
  if(cur.selected) cellByNum.get(cur.selected.n).classList.remove('target');
  cur.selected = e;
  const div = cellByNum.get(e.n);
  div.classList.remove('candidate');
  div.classList.add('target');
  const input = document.getElementById('groupInput');
  const btn = document.getElementById('groupSubmitBtn');
  if(input){ input.disabled=false; input.value=''; input.focus(); }
  if(btn) btn.disabled=false;
  clearFeedback();
}
function handleGroupTap(e){
  const cur = state.current;
  const isMember = cur.members.some(m=>m.n===e.n);
  if(!isMember || cur.filled.has(e.n)) return; // 対象外、または既に完了したマスは無視
  selectGroupCell(e);
}
function submitGroupAnswer(){
  const cur = state.current;
  if(!cur.selected) return;
  const input = document.getElementById('groupInput');
  const val = normalizeSymbol(input.value);
  const target = cur.selected;
  const div = cellByNum.get(target.n);

  if(val === target.sym){
    div.classList.add('show-label','correct','filled');
    div.classList.remove('target');
    cur.filled.add(target.n);
    cur.selected = null;
    const span = document.getElementById('groupRemaining');
    if(span) span.textContent = cur.members.length - cur.filled.size;
    clearFeedback();
    if(cur.filled.size === cur.members.length){ finishGroupRound(true); return; }
    const next = cur.members.find(m=>!cur.filled.has(m.n));
    if(next) selectGroupCell(next);
  } else {
    cur.mistakes++;
    div.classList.add('wrong');
    setTimeout(()=>div.classList.remove('wrong'), 350);
    setFeedback('不正解。もう一度入力してください', 'bad');
    input.value=''; input.focus();
  }
}
function giveUpGroup(){
  if(state.busy) return;
  state.busy = true;
  const cur = state.current;
  cur.members.forEach(m=>{
    if(!cur.filled.has(m.n)){
      const div = cellByNum.get(m.n);
      div.classList.remove('candidate','target');
      div.classList.add('show-label','reveal');
    }
  });
  finishGroupRound(false);
}
function finishGroupRound(success){
  state.busy = true;
  const cur = state.current;
  const stats = state.stats[state.mode];
  stats.total++;
  if(success){
    stats.correct++; stats.streak++; if(stats.streak>stats.best) stats.best=stats.streak;
    maybeUpdateBestStreak(state.mode, state.range, stats.streak);
    setFeedback(cur.mistakes===0 ? 'パーフェクト！全部書けました！' : `全部書けました（ミス${cur.mistakes}回）`, 'good');
  } else {
    stats.streak = 0;
    setFeedback('正解を表示しました', 'bad');
  }
  updateStatusBar();
  scheduleNext(()=>advanceQuestion(), success?1200:1900);
}

/* =========================================================
   14. 問題種別 5：その他問題（周期表の傾向）
   ========================================================= */

function generateTrendQuestion(){
  for(let attempt=0; attempt<30; attempt++){
    const prop = TREND_PROPERTIES[Math.floor(Math.random()*TREND_PROPERTIES.length)];
    const cols = prop.key==='en' ? [1,2,13,14,15,16,17] : [1,2,13,14,15,16,17,18];
    const col = cols[Math.floor(Math.random()*cols.length)];
    const groupDef = TREND_GROUPS[col];
    let candidates = state.activeElements.filter(groupDef.filter);
    if(candidates.length<2) continue;
    candidates.sort((a,b)=>a.row-b.row);
    if(candidates.length>5){
      const first=candidates[0], last=candidates[candidates.length-1];
      const middle = shuffle(candidates.slice(1,-1)).slice(0,3);
      candidates = [first,...middle,last].sort((a,b)=>a.row-b.row);
    }
    const direction = Math.random()<0.5 ? 'max' : 'min';
    const rows = candidates.map(c=>c.row);
    let wantRow;
    if(prop.bigRowIsBig) wantRow = direction==='max' ? Math.max(...rows) : Math.min(...rows);
    else wantRow = direction==='max' ? Math.min(...rows) : Math.max(...rows);
    const answer = candidates.find(c=>c.row===wantRow);
    return { property:prop, direction, groupLabel:groupDef.label, candidates, answer };
  }
  return null;
}
function clearTrendHighlights(){
  document.querySelectorAll('.cell.candidate').forEach(d=>d.classList.remove('candidate'));
}
function beginTrendQuestion(){
  setDefaultLabels(true);
  const q = generateTrendQuestion();
  if(!q){ beginPositionQuestion(); return; }
  state.current = { kind:'trend', stage:'tap', q };
  q.candidates.forEach(c=> cellByNum.get(c.n).classList.add('candidate'));
  const dirLabel = q.direction==='max' ? '最も大きい' : '最も小さい';
  promptPanel.innerHTML = `
    <div class="prompt-eyebrow">周期表の傾向</div>
    <p class="prompt-text">${q.groupLabel}のうち、周期表の位置関係から考えて<strong>${q.property.label}が${dirLabel}</strong>と考えられる元素を、青い枠の中からタップしてください。</p>
  `;
  controls.innerHTML = `<button class="btn btn-ghost" id="trendSkipBtn" type="button">スキップ（答えを見る）</button>`;
  document.getElementById('trendSkipBtn').addEventListener('click', skipTrend);
  updateStatusBar();
}
function handleTrendTap(e){
  if(state.busy) return;
  const cur = state.current;
  if(cur.stage!=='tap') return;
  const isCandidate = cur.q.candidates.some(c=>c.n===e.n);
  if(!isCandidate){ failTrend(); return; }
  if(e.n===cur.q.answer.n){
    cellByNum.get(e.n).classList.add('correct');
    clearTrendHighlights();
    cur.stage = 'type';
    renderTextAnswerUI(`
      <div class="prompt-eyebrow">周期表の傾向</div>
      <p class="prompt-text">正解！ その元素の<strong>元素記号</strong>を入力してください。</p>
    `, handleTrendSymbolAnswer, {placeholder:'例: Na', maxlength:3});
  } else {
    failTrend();
  }
}
function failTrend(){
  state.busy = true;
  const cur = state.current;
  clearTrendHighlights();
  cellByNum.get(cur.q.answer.n).classList.add('show-label','reveal');
  const stats = state.stats[state.mode];
  stats.total++; stats.streak=0;
  setFeedback(`不正解。正解は ${cur.q.answer.sym}（${cur.q.answer.name}）でした`, 'bad');
  updateStatusBar();
  scheduleNext(()=>advanceQuestion(), 1900);
}
function handleTrendSymbolAnswer(raw){
  if(state.busy) return;
  const val = normalizeSymbol(raw);
  if(!val) return;
  state.busy = true;
  const cur = state.current;
  const stats = state.stats[state.mode];
  stats.total++;
  if(val === cur.q.answer.sym){
    stats.correct++; stats.streak++; if(stats.streak>stats.best) stats.best=stats.streak;
    maybeUpdateBestStreak(state.mode, state.range, stats.streak);
    setFeedback('正解！', 'good');
    scheduleNext(()=>advanceQuestion(), 900);
  } else {
    stats.streak = 0;
    setFeedback(`惜しい！記号は ${cur.q.answer.sym} でした`, 'bad');
    scheduleNext(()=>advanceQuestion(), 1800);
  }
  updateStatusBar();
}
function skipTrend(){
  if(state.busy) return;
  state.busy = true;
  const cur = state.current;
  clearTrendHighlights();
  cellByNum.get(cur.q.answer.n).classList.add('show-label','reveal');
  setFeedback(`正解は ${cur.q.answer.sym}（${cur.q.answer.name}）`, 'neutral');
  scheduleNext(()=>advanceQuestion(), 1800);
}

/* =========================================================
   14b. 問題種別 6：豆知識クイズ
   ========================================================= */

function beginTriviaQuestion(){
  const prevN = state.current && state.current.target ? state.current.target.n : null;
  const target = pickRandomElement(prevN);
  state.current = { kind:'trivia', target };
  setDefaultLabels(true);
  const fact = ELEMENT_FACTS[target.n] || 'この元素の特徴を考えてみましょう。';

  renderTextAnswerUI(`
    <div class="prompt-eyebrow">豆知識クイズ</div>
    <p class="prompt-text">次の特徴を持つ元素は？<br>「${fact}」</p>
    <p class="prompt-text fact">元素記号でも元素名（ひらがな・カタカナ・漢字）でも回答できます。</p>
  `, handleTriviaAnswer, {placeholder:'例: Na / ナトリウム', maxlength:16, wide:true});
  updateStatusBar();
}
function handleTriviaAnswer(raw){
  if(state.busy) return;
  const val = (raw||'').trim();
  if(!val) return;
  state.busy = true;
  const target = state.current.target;
  const stats = state.stats[state.mode];
  const correct = normalizeSymbol(val)===target.sym || acceptableNameAnswers(target).has(normalizeJP(val));
  stats.total++;
  if(correct){ stats.correct++; stats.streak++; if(stats.streak>stats.best) stats.best=stats.streak; maybeUpdateBestStreak(state.mode, state.range, stats.streak); }
  else stats.streak = 0;
  setFeedback(correct ? '正解！' : `不正解。正解は ${target.sym}（${target.name}）でした`, correct?'good':'bad');
  scheduleNext(()=>advanceQuestion(), correct?900:2000);
  updateStatusBar();
}

/* =========================================================
   15. タイムアタック
   ========================================================= */

function stopTimer(){
  if(state.timeAttack.timerId){ clearInterval(state.timeAttack.timerId); state.timeAttack.timerId = null; }
  state.timeAttack.running = false;
}
function startTimeAttack(){
  clearTimeout(state.pendingTimeout); state.busy=false;
  stopTimer();
  resetCellVisuals();
  clearFeedback();
  state.timeAttack = { running:false, startTs:0, mistakes:0, filled:new Set(), selected:null, timerId:null, lastResult:null };
  setDefaultLabels(false);

  const best = getBestTimeAttack(state.range);
  promptPanel.innerHTML = `
    <div class="prompt-eyebrow">真っ白周期表埋めタイムアタック</div>
    <p class="prompt-text">「スタート」を押すと計測開始。マスをタップして元素記号を入力し、選んだ範囲を全部埋めるまでのタイムを競います。正解すると自動的に次のマスが選ばれます。</p>
    ${best ? `<p class="prompt-text fact">自己ベスト：${formatTime(best.bestTimeMs)}（ミス${best.bestMistakes}）</p>` : ''}
  `;
  controls.innerHTML = `<button class="btn btn-primary" id="taStartBtn" type="button">スタート</button>`;
  document.getElementById('taStartBtn').addEventListener('click', beginTimeAttackTimer);
  renderTimeAttackStatus();
}
function beginTimeAttackTimer(){
  state.timeAttack.running = true;
  state.timeAttack.startTs = performance.now();
  state.timeAttack.timerId = setInterval(renderTimeAttackStatus, 100);

  controls.innerHTML = `
    <div class="field-row">
      <input type="text" id="taInput" class="text-input" placeholder="マスをタップ" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="3" disabled>
      <button class="btn btn-primary" id="taSubmitBtn" type="button" disabled>入力</button>
    </div>
    <button class="btn btn-ghost" id="taResetBtn" type="button">リセット</button>
  `;
  document.getElementById('taSubmitBtn').addEventListener('click', submitTimeAttack);
  document.getElementById('taInput').addEventListener('keydown', ev=>{ if(ev.key==='Enter') submitTimeAttack(); });
  document.getElementById('taResetBtn').addEventListener('click', startTimeAttack);

  const firstElement = state.activeElements.find(e=>e.n===1) || state.activeElements[0];
  selectTimeAttackCell(firstElement);
  renderTimeAttackStatus();
}
function selectTimeAttackCell(e){
  const ta = state.timeAttack;
  if(ta.selected) cellByNum.get(ta.selected.n).classList.remove('target');
  ta.selected = e;
  cellByNum.get(e.n).classList.add('target');
  const input = document.getElementById('taInput');
  const btn = document.getElementById('taSubmitBtn');
  if(input){ input.disabled=false; input.value=''; input.focus(); }
  if(btn) btn.disabled=false;
  clearFeedback();
}
function handleTimeAttackSelect(e){
  const ta = state.timeAttack;
  if(!ta.running){ setFeedback('まず「スタート」を押してください', 'neutral'); return; }
  if(ta.filled.has(e.n)) return;
  selectTimeAttackCell(e);
}
function findNextUnfilled(afterN){
  const remaining = state.activeElements.filter(e=>!state.timeAttack.filled.has(e.n)).sort((a,b)=>a.n-b.n);
  if(!remaining.length) return null;
  return remaining.find(e=>e.n>afterN) || remaining[0];
}
function submitTimeAttack(){
  const ta = state.timeAttack;
  if(!ta.running || !ta.selected) return;
  const input = document.getElementById('taInput');
  const val = normalizeSymbol(input.value);
  const target = ta.selected;
  const div = cellByNum.get(target.n);

  if(val === target.sym){
    div.classList.add('show-label','correct','filled');
    div.classList.remove('target');
    ta.filled.add(target.n);
    ta.selected = null;
    clearFeedback();
    if(ta.filled.size === state.activeElements.length){ finishTimeAttack(); return; }
    const next = findNextUnfilled(target.n);
    if(next) selectTimeAttackCell(next);
    renderTimeAttackStatus();
  } else {
    ta.mistakes++;
    div.classList.add('wrong');
    setTimeout(()=>div.classList.remove('wrong'), 350);
    setFeedback('不正解。もう一度入力してください', 'bad');
    input.value=''; input.focus();
    renderTimeAttackStatus();
  }
}
function finishTimeAttack(){
  const ta = state.timeAttack;
  const elapsed = performance.now() - ta.startTs;
  stopTimer();
  ta.lastResult = { timeMs:elapsed, mistakes:ta.mistakes };
  const improved = maybeUpdateBestTimeAttack(state.range, elapsed, ta.mistakes);
  const best = getBestTimeAttack(state.range);
  submitScore('timeattack', state.range, { timeMs:elapsed, mistakes:ta.mistakes });

  promptPanel.innerHTML = `
    <div class="prompt-eyebrow">完了！${improved ? '　🎉 新記録！' : ''}</div>
    <p class="prompt-text">タイム <strong>${formatTime(elapsed)}</strong>　ミス <strong>${ta.mistakes}</strong> 回</p>
    ${best ? `<p class="prompt-text fact">自己ベスト：${formatTime(best.bestTimeMs)}（ミス${best.bestMistakes}）</p>` : ''}
  `;
  controls.innerHTML = `
    <button class="btn btn-primary" id="taAgainBtn" type="button">もう一度</button>
    <button class="btn-text" id="taRankBtn" type="button">ランキングを見る</button>
  `;
  document.getElementById('taAgainBtn').addEventListener('click', startTimeAttack);
  document.getElementById('taRankBtn').addEventListener('click', ()=> showRanking('timeattack','all'));
  clearFeedback();
  renderTimeAttackStatus();
}
function renderTimeAttackStatus(){
  const ta = state.timeAttack;
  const elapsed = ta.running ? performance.now() - ta.startTs : 0;
  const total = state.activeElements.length;
  const best = getBestTimeAttack(state.range);
  statusBar.innerHTML = `
    <span class="stat">タイム <strong>${formatTime(elapsed)}</strong></span>
    <span class="stat">ミス <strong>${ta.mistakes}</strong></span>
    <span class="stat">${ta.filled.size} / ${total} 埋まった</span>
    ${best ? `<span class="stat">自己ベスト <strong>${formatTime(best.bestTimeMs)}</strong></span>` : ''}
    <button class="btn-text" id="shareBtn" type="button">結果をシェア</button>
    <button class="btn-text" id="rankBtn" type="button">ランキング</button>
  `;
  wireShareButton();
  wireRankButton('timeattack');
}

/* =========================================================
   16. セル共通クリック処理
   ========================================================= */

function onCellClick(e){
  const div = cellByNum.get(e.n);
  if(div.classList.contains('locked')) return;

  if(state.mode==='home'){ showInfo(e); return; }
  if(state.mode==='timeattack'){ handleTimeAttackSelect(e); return; }

  const kind = state.current && state.current.kind;
  if(kind==='position') handlePositionAnswer(e);
  else if(kind==='group') handleGroupTap(e);
  else if(kind==='trend') handleTrendTap(e);
  // 'type' と 'match' のときはテーブルのクリックは無効
}

/* =========================================================
   17. スコア表示・結果シェア
   ========================================================= */

function updateStatusBar(){
  if(state.mode==='timeattack'){ renderTimeAttackStatus(); return; }
  const s = state.stats[state.mode];
  if(!s){ statusBar.innerHTML=''; return; }
  const acc = s.total ? Math.round(s.correct/s.total*100) : 0;
  const progressStat = state.mode==='exam' ? `<span class="stat">問題 <strong>${Math.min(s.total,EXAM_TOTAL_QUESTIONS)}</strong>/${EXAM_TOTAL_QUESTIONS}</span>` : '';
  statusBar.innerHTML = `
    ${progressStat}
    <span class="stat">正解 <strong>${s.correct}</strong>/${s.total}</span>
    <span class="stat">正答率 <strong>${acc}%</strong></span>
    <span class="stat">連続正解 <strong>${s.streak}</strong>（自己ベスト ${s.best}）</span>
    <button class="btn-text" id="resetStatsBtn" type="button">記録をリセット</button>
    <button class="btn-text" id="shareBtn" type="button">結果をシェア</button>
    ${state.mode==='exam' ? '<button class="btn-text" id="rankBtn" type="button">ランキング</button>' : ''}
  `;
  const resetBtn = document.getElementById('resetStatsBtn');
  if(resetBtn){
    resetBtn.addEventListener('click', ()=>{
      state.stats[state.mode] = { correct:0, total:0, streak:0, best:getBestStreak(state.mode, state.range) };
      updateStatusBar();
    });
  }
  wireShareButton();
  if(state.mode==='exam') wireRankButton('exam');
}
function wireShareButton(){
  const btn = document.getElementById('shareBtn');
  if(btn) btn.addEventListener('click', handleShareClick);
}
function wireRankButton(mode){
  const btn = document.getElementById('rankBtn');
  if(btn) btn.addEventListener('click', ()=> showRanking(mode,'all'));
}
const SHARE_LINK = 'https://yms334.github.io/periodic_table/';
function buildShareText(){
  const nickname = store.nickname || '名無し';
  const rangeText = rangeSelect.options[rangeSelect.selectedIndex] ? rangeSelect.options[rangeSelect.selectedIndex].textContent : `〜${state.range}`;
  const modeLabel = MODE_LABELS[state.mode] || state.mode;

  if(state.mode==='timeattack'){
    const ta = state.timeAttack;
    const best = getBestTimeAttack(state.range);
    const lines = [`🧪周期表ドリル - ${modeLabel}`, `ニックネーム: ${nickname}`, `範囲: ${rangeText}`];
    if(ta.lastResult) lines.push(`タイム ${formatTime(ta.lastResult.timeMs)}（ミス${ta.lastResult.mistakes}）`);
    if(best) lines.push(`自己ベスト ${formatTime(best.bestTimeMs)}（ミス${best.bestMistakes}）`);
    if(!ta.lastResult && !best) lines.push('まだ記録がありません');
    lines.push(`挑戦はこちら → ${SHARE_LINK}`);
    return lines.join('\n');
  }
  const s = state.stats[state.mode];
  if(!s) return `🧪周期表ドリル\nニックネーム: ${nickname}\n挑戦はこちら → ${SHARE_LINK}`;
  const acc = s.total ? Math.round(s.correct/s.total*100) : 0;
  return [
    `🧪周期表ドリル - ${modeLabel}`,
    `ニックネーム: ${nickname}`,
    `範囲: ${rangeText}`,
    `正解 ${s.correct}/${s.total}（正答率${acc}%）`,
    `連続正解 ${s.streak}（自己ベスト${s.best}）`,
    `挑戦はこちら → ${SHARE_LINK}`
  ].join('\n');
}
async function handleShareClick(){
  const text = buildShareText();
  const ok = await copyToClipboard(text);
  setFeedback(ok ? '結果をコピーしました！貼り付けて共有できます。' : 'コピーに失敗しました。お使いのブラウザではこの機能に対応していない場合があります。', ok?'good':'bad');
}

/* =========================================================
   18. ニックネーム
   ========================================================= */

function updateNicknameDisplay(){
  const el = document.getElementById('nicknameDisplay');
  if(el) el.textContent = store.nickname ? `👤 ${store.nickname}` : '';
}
function openNicknameOverlay(isFirstTime, onDone){
  const overlay = document.getElementById('nicknameOverlay');
  const input = document.getElementById('nicknameInput');
  const btn = document.getElementById('nicknameSubmitBtn');
  const title = document.getElementById('nicknameTitle');
  title.textContent = isFirstTime ? 'ようこそ！' : 'ニックネームの変更';
  btn.textContent = isFirstTime ? 'はじめる' : '変更する';
  input.value = store.nickname || '';
  overlay.hidden = false;
  input.focus();

  let done = false;
  function submit(){
    if(done) return;
    const val = input.value.trim().slice(0,12);
    if(!val){ input.focus(); return; }
    done = true;
    store.nickname = val;
    saveStore();
    overlay.hidden = true;
    updateNicknameDisplay();
    btn.removeEventListener('click', submit);
    input.removeEventListener('keydown', onKey);
    if(onDone) onDone();
  }
  function onKey(ev){ if(ev.key==='Enter') submit(); }
  btn.addEventListener('click', submit);
  input.addEventListener('keydown', onKey);
}
function ensureNickname(onDone){
  if(store.nickname){ onDone(); return; }
  openNicknameOverlay(true, onDone);
}

/* =========================================================
   19. 初期化
   ========================================================= */

function init(){
  buildTable();
  buildTabs();
  buildLegend();
  applyRange(DEFAULT_RANGE);
  rangeSelect.value = String(DEFAULT_RANGE);
  resetAllSessionStats(DEFAULT_RANGE);
  updateNicknameDisplay();

  rangeSelect.addEventListener('change', ()=>{
    const newRange = +rangeSelect.value;
    applyRange(newRange);
    resetAllSessionStats(newRange);
    restartCurrentMode();
  });
  document.getElementById('changeNicknameBtn').addEventListener('click', ()=> openNicknameOverlay(false));

  ensureNickname(()=>{ switchMode('home'); });
}
function restartCurrentMode(){
  const m = state.mode;
  if(m==='home') startHome();
  else if(m==='timeattack') startTimeAttack();
  else if(m==='exam') startExam();
  else beginQuestionKind(m);
}

document.addEventListener('DOMContentLoaded', init);

})();
</script>
